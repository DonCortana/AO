# Monthly Benchmark, n=1 for broader diagnostic visibility and competitor
# context (Operating System §9). Also carries the monthly Frozen Core (n=5)
# when the measurement window is eligible, and the full readiness refresh.
# Non-round cron minute per Operating System §4.

name: Benchmark Monthly

# SCHEDULE DISABLED (Action Plan v2.0 Phase A). There is no
# atlas.runners.benchmark_monthly yet, so a scheduled run could only report
# success for work that did not happen. The cron below is retained, commented,
# so it can be restored in the same commit that lands the real runner.
#
#  schedule:
#    - cron: "17 9 1 * *" # 1st of month, 09:17 UTC
on:
  workflow_dispatch: {}

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Materialize Vertex AI service account credentials (D-029)
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Run monthly Benchmark (n=1) + Frozen Core (n=5) where eligible
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLAS_ENV: production
        run: |
          echo "::error::atlas.runners.benchmark_monthly is not implemented. This"
          echo "::error::workflow fails deliberately rather than reporting success"
          echo "::error::for work that did not happen (Phase A: green means executed)."
          exit 1

      - name: Reconcile
        if: always()
        run: |
          echo "::error::The benchmark reconcile entry point is not implemented."
          exit 1

# System Zero — manual only. Execution Plan §3: "System Zero must not delay
# commercial conversations. Outreach may begin while System Zero runs. What
# may not happen is delivery of a frozen Atlas score before the hospitality
# calibration gate passes." It is never scheduled — it's an engineering
# test run deliberately, on demand, against Atlas's own domain.

name: System Zero

on:
  workflow_dispatch:
    inputs:
      property_id:
        description: "System Zero property UUID (properties.is_system_zero = true)"
        required: true
        type: string

jobs:
  run-system-zero:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Materialize Vertex AI service account credentials (D-029)
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Run System Zero pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLAS_ENV: production
        run: |
          echo "::error::atlas.runners.system_zero is not implemented. This workflow"
          echo "::error::fails deliberately rather than reporting success for work"
          echo "::error::that did not happen (Phase A: green must mean executed)."
          echo "::error::Acceptance criteria: docs/atlas-execution-plan-v1.0.md §3 —"
          echo "::error::do not mark this workflow done until every row there passes."
          exit 1

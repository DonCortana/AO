# Weekly Sentinel Set, n=1. Operating System §9. Anomaly/direction
# monitoring only — Methodology §6.1: Sentinel replicates "may NOT support
# a movement verdict." Never promote this workflow's output to a client
# movement claim.
#
# Cron avoids the top of the hour per Operating System §4 ("Cron schedules
# avoid the start of the hour. Use a non-round minute such as :17 or :37.").

name: Sentinel Weekly

# SCHEDULE DISABLED (Action Plan v2.0 Phase A). There is no
# atlas.runners.sentinel yet, so a scheduled run could only report success for
# work that did not happen. The cron below is retained, commented, so it can be
# restored in the same commit that lands the real runner.
#
#  schedule:
#    - cron: "37 8 * * 1" # Monday 08:37 UTC
on:
  workflow_dispatch: {} # manual recovery path required for every scheduled workflow (Operating System §4)

jobs:
  run-sentinel:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Materialize Vertex AI service account credentials (D-029)
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Run weekly Sentinel Set (n=1, 4-6 prompts per active property)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLAS_ENV: production
        run: |
          echo "::error::atlas.runners.sentinel is not implemented. This workflow"
          echo "::error::fails deliberately rather than reporting success for work"
          echo "::error::that did not happen (Phase A: green must mean executed)."
          exit 1

      - name: Reconcile
        if: always()
        run: |
          echo "::error::The sentinel reconcile entry point is not implemented."
          exit 1

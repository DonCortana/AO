[project]
name = "atlas-visibility"
version = "0.1.0"
description = "Atlas Optimisation measurement and delivery pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "supabase>=2.6",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "google-genai>=0.5",
    # Google Sheets (RPV labeling surface, atlas.tools.rpv_labeling) and Drive
    # (Evidence Vault storage, Operating System §3). google-auth arrives
    # transitively via google-genai but the API client does not — declared
    # here rather than installed ad hoc, which is how psycopg2 ended up
    # undeclared and absent from a clean checkout (see the dev extra below).
    "google-api-python-client>=2.100",
    "anthropic>=0.34",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # Used by migration DDL (migrations/*.sql are applied over a direct
    # Postgres connection, not through the Supabase REST client). Installed
    # ad hoc during the migration 0003 work and never declared — a clean
    # checkout or CI run would not have had it.
    "psycopg2-binary>=2.9",
]

# Pinned explicitly rather than left to ruff's defaults. Ruff changes which
# rules are on by default between releases, and an unpinned selection means a
# routine ruff upgrade turns a green required check red on code nobody
# touched. The version itself is pinned in requirements-dev.txt — this is the
# other half of the same "pin, don't float" rule (Phase A spec §6).
#
# Scope is deliberately correctness-first rather than style-first: this gate
# went in alongside Phase A, and a selection that demanded a repo-wide
# restyle would have buried the engine-safety diff in unrelated churn.
# Widening it later is a standalone change with its own review.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle correctness subset (not E5 line length)
    "F",               # pyflakes
    "I",               # import sorting
    "B",               # bugbear
    "BLE",             # blind except — resume.py's fail-closed catch is a deliberate noqa
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

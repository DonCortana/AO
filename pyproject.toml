[project]
name = "atlas-visibility"
version = "0.1.0"
description = "Atlas Optimisation measurement and delivery pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "supabase>=2.6",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "google-genai>=0.5",
    # Google Sheets (RPV labeling surface, atlas.tools.rpv_labeling) and Drive
    # (Evidence Vault storage, Operating System §3). google-auth arrives
    # transitively via google-genai but the API client does not — declared
    # here rather than installed ad hoc, which is how psycopg2 ended up
    # undeclared and absent from a clean checkout (see the dev extra below).
    "google-api-python-client>=2.100",
    "anthropic>=0.34",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # Used by migration DDL (migrations/*.sql are applied over a direct
    # Postgres connection, not through the Supabase REST client). Installed
    # ad hoc during the migration 0003 work and never declared — a clean
    # checkout or CI run would not have had it.
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
